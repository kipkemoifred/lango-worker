# ---------------------------------------------------------------------------
# Lango worker
# ---------------------------------------------------------------------------
quarkus.application.name=lango-worker
quarkus.http.port=8081

# --- Temporal ---------------------------------------------------------------
# Ticket workflows and activities go on the default worker, which polls the
# queue the Go backend starts ticket workflows on.
quarkus.temporal.worker.task-queue=lango-tickets-tq
# Onboarding has its own worker and queue (classes opt in with
# @TemporalWorkflow / @TemporalActivity(workers = "onboarding")), so a backlog of
# applications never slows down ticket SLAs.
quarkus.temporal.worker.onboarding.task-queue=lango-onboarding-tq
quarkus.temporal.namespace=${QUARKUS_TEMPORAL_NAMESPACE:default}

# In prod, connect to the real cluster (env var QUARKUS_TEMPORAL_CONNECTION_TARGET
# overrides this). In dev mode it's left unset, so Quarkus Dev Services starts a
# local Temporal server in Docker instead, on a fixed port so the CLI can reach it.
%prod.quarkus.temporal.connection.target=temporal:7233
quarkus.temporal.devservices.port=7233

# --- Merchant onboarding policy ----------------------------------------------
# PLACEHOLDERS until the business confirms them. Each workflow reads these once
# when it starts, so changing them only affects new applications.
# Hours each review stage may take before its owners are alerted (tier 0)
lango.onboarding.review-deadline-hours=${LANGO_ONBOARDING_REVIEW_DEADLINE_HOURS:24}
lango.onboarding.compliance-deadline-hours=${LANGO_ONBOARDING_COMPLIANCE_DEADLINE_HOURS:48}
lango.onboarding.ict-deadline-hours=${LANGO_ONBOARDING_ICT_DEADLINE_HOURS:48}
# Gap in hours before management tier 1, 2, ... after the tier 0 alert
lango.onboarding.escalation-tier-hours=${LANGO_ONBOARDING_ESCALATION_TIER_HOURS:24,24}
# Hours the sales agent has to resubmit a returned application before it is declined
lango.onboarding.amendment-deadline-hours=${LANGO_ONBOARDING_AMENDMENT_DEADLINE_HOURS:168}
# Returns allowed; one more return declines the application
lango.onboarding.max-amendment-cycles=${LANGO_ONBOARDING_MAX_AMENDMENT_CYCLES:3}

# --- gRPC callback client to the Go backend --------------------------------
# Accepts the env var names used in the spec's docker-compose / Helm values.
quarkus.grpc.clients.lango-go-backend.host=${GRPC_CLIENTS_LANGO_GO_BACKEND_HOST:localhost}
quarkus.grpc.clients.lango-go-backend.port=${GRPC_CLIENTS_LANGO_GO_BACKEND_PORT:9090}

# --- Tests ------------------------------------------------------------------
# @QuarkusTest runs against Temporal's in-memory test server (no Docker needed)
%test.quarkus.temporal.enable-mock=true
%test.quarkus.devservices.enabled=false
# Random HTTP port, so tests can run while quarkus:dev holds 8081
%test.quarkus.http.test-port=0
%test.quarkus.grpc.clients.lango-go-backend.host=localhost
%test.quarkus.grpc.clients.lango-go-backend.port=19090
# In test mode Quarkus dials test-port (default 9001), not port
quarkus.grpc.clients.lango-go-backend.test-port=19090

# --- Code generation ---------------------------------------------------------
# With Kotlin on the classpath Quarkus also generates protobuf Kotlin DSL files,
# which need protobuf-kotlin. The code only uses the Java builders, so skip them.
quarkus.generate-code.grpc.kotlin.generate=false
